# Local dev runs on DuckDB; hosting switches to BigQuery with `--target bigquery`.
ads_pnl:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      threads: 4
    bigquery:
      type: bigquery
      method: "{{ env_var('BQ_AUTH_METHOD', 'oauth') }}"
      keyfile: "{{ env_var('BQ_KEYFILE', '') }}"
      project: "{{ env_var('BQ_PROJECT', 'set-BQ_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'ads_pnl') }}"
      location: "{{ env_var('BQ_LOCATION', 'asia-south1') }}"
      threads: 4
      priority: interactive
